name: Nightly frozen ORB and EMA forward research — review only

on:
  workflow_dispatch:
  schedule:
    # 17:30 UTC = 23:00 India time on weekdays.
    # Research ends yesterday IST to exclude incomplete same-day candles.
    - cron: "30 17 * * 1-5"

permissions:
  contents: read
  issues: write

concurrency:
  group: frozen-simple-index-research-review
  cancel-in-progress: false

jobs:
  frozen_forward_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate research code before reading market data
        run: python -m unittest discover -s tests -q

      - name: Restore historical index candles
        uses: actions/cache@v4
        with:
          path: trader/backtest_cache
          key: frozen-index-forward-v1-${{ github.run_id }}
          restore-keys: |
            frozen-index-forward-v1-

      - name: Collect post-freeze sessions and test four FIXED hypotheses
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          python -m india_trader.nightly_forward \
            --out trader/backtests/nightly_forward_research.json

      - name: Render review proposal from verified report
        run: |
          python -m india_trader.research_review \
            --report trader/backtests/nightly_forward_research.json \
            --markdown-out trader/backtests/nightly_research_review.md

      - name: Update one GitHub Issue for human approval (Mondays or manual runs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DOW="$(TZ=Asia/Kolkata date +%u)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${DOW}" == "1" ]]; then
            python -m india_trader.research_review \
              --report trader/backtests/nightly_forward_research.json \
              --markdown-out trader/backtests/nightly_research_review.md \
              --publish
          else
            echo "Nightly research complete; updating the single review Issue on Monday."
          fi

      - name: Publish actual paper-trade strategy evaluation
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET }}
          FIREBASE_PROJECT_ID: stock-market-c5016
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install google-auth requests
          test -n "$FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET" || { echo "::error::Missing Firestore service account"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET" > "$RUNNER_TEMP/paper-evaluation-key.json"
          chmod 600 "$RUNNER_TEMP/paper-evaluation-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/paper-evaluation-key.json"
          trap 'rm -f "$RUNNER_TEMP/paper-evaluation-key.json"' EXIT
          python -m deploy.nightly_strategy_evaluation

      - name: Preserve report, diagnostics and review proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-index-research-review
          path: |
            trader/backtests/nightly_forward_research.json
            trader/backtests/nightly_research_review.md
          if-no-files-found: warn
          retention-days: 30
