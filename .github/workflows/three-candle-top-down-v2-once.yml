name: One-time 365-day 3 Candle Top Down V2 research
on:
  push:
    paths:
      - .github/workflows/three-candle-top-down-v2-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: trader/backtest_cache
          key: three-candle-v2-${{ github.run_id }}
          restore-keys: |
            three-candle-v2-
            three-candle-365-
      - name: Research 365 calendar days NIFTY and SENSEX
        run: |
          test -n "$UPSTOX_ACCESS_TOKEN"
          python -m india_trader.three_candle_top_down_v2 --days 365 --out trader/backtests/three_candle_top_down_v2_365.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-candle-top-down-v2-365
          path: trader/backtests/three_candle_top_down_v2_365.json
