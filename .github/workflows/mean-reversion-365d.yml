name: Mean Reversion 365-Day Research
on:
  push:
    branches:
      - research/mean-reversion-365d-20261119
    paths:
      - '.github/workflows/mean-reversion-365d.yml'
      - 'deploy/mean_reversion_365d.py'
      - 'deploy/mean_reversion_historical_data.py'
      - 'tests/test_mean_reversion_365d.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Mean Reversion research unit tests
        run: python -m unittest discover -s tests -p 'test_mean_reversion_365d.py' -v
      - name: Restore existing historical market cache
        uses: actions/cache@v4
        with:
          path: trader/backtest_cache
          key: mean-reversion-365-${{ github.run_id }}
          restore-keys: |
            ema9-fib-365-
            three-candle-v2-
            ema9-daily-
            mean-reversion-365-
      - name: Fetch genuine NIFTY and SENSEX 5m candles
        run: |
          set -euo pipefail
          test -n "$UPSTOX_ACCESS_TOKEN" || { echo "::error::UPSTOX_ACCESS_TOKEN secret missing"; exit 1; }
          for attempt in 1 2 3; do
            if python -m deploy.mean_reversion_historical_data --days 400 --out-dir research_data; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Run real 365+ day NIFTY and SENSEX index-proxy backtest
        run: |
          python -m deploy.mean_reversion_365d --nifty research_data/nifty_5m.csv --sensex research_data/sensex_5m.csv --cost-bps 10 --output mean_reversion_365d_results.json
      - name: Publish metrics to GitHub summary
        if: success()
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open("mean_reversion_365d_results.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Mean Reversion 365-day index proxy (not CE/PE fills)\n\n")
              f.write("| Market | Sessions | Holdout trades | Win % | Net R | PF | Max DD R | Proxy gate |\n|---|---:|---:|---:|---:|---:|---:|---|\n")
              for market in ("NIFTY","SENSEX"):
                  x=d[market]; h=x.get("holdout",{})
                  f.write(f"| {market} | {x.get('sessions','—')} | {h.get('trades','—')} | {h.get('win_rate_pct','—')} | {h.get('net_r','—')} | {h.get('profit_factor','—')} | {h.get('max_drawdown_r','—')} | {x.get('passes_proxy_gate',False)} |\n")
              f.write("\n**Not executable options P&L. No broker orders.**\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mean-reversion-365d-results
          path: mean_reversion_365d_results.json
          if-no-files-found: warn
          retention-days: 30
