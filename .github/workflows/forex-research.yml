name: Isolated Forex Research (CSV)
on:
  workflow_dispatch:
    inputs:
      pair:
        description: Currency pair (EURUSD, GBPUSD, USDJPY)
        required: true
        type: choice
        options: [EURUSD, GBPUSD, USDJPY]
      csv_url:
        description: Public direct HTTPS URL to a 1-minute OHLC CSV (UTC timestamps); no tokens or private URLs
        required: true
        type: string
permissions:
  contents: read
jobs:
  forex-research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download user-supplied public dataset
        env:
          CSV_URL: ${{ inputs.csv_url }}
        run: |
          python - <<'PY'
          import os,urllib.parse,urllib.request
          url=os.environ["CSV_URL"];p=urllib.parse.urlparse(url)
          if p.scheme!="https" or not p.hostname or p.username or p.password:
              raise SystemExit("DATA_UNAVAILABLE: HTTPS public CSV URL required")
          req=urllib.request.Request(url,headers={"User-Agent":"forex-research/1.0"})
          with urllib.request.urlopen(req,timeout=90) as response,open("candles.csv","wb") as out:
              if response.geturl().split(":")[0]!="https":raise SystemExit("HTTPS redirect required")
              total=0
              while True:
                  chunk=response.read(1024*1024)
                  if not chunk:break
                  total+=len(chunk)
                  if total>350*1024*1024:raise SystemExit("CSV exceeds 350MB")
                  out.write(chunk)
          PY
      - name: Backtest spot proxy only (no broker orders)
        run: |
          python forex_research/forex_backtest.py --csv candles.csv --pair "${{ inputs.pair }}" --out "forex_results/${{ inputs.pair }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forex-research-${{ inputs.pair }}
          path: forex_results/*.json
          if-no-files-found: warn
          retention-days: 30
