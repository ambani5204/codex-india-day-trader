name: Phase 0 read-only Firestore schema evidence
on:
  push:
    branches:
      - audit/phase0-exit-evidence-20261120
    paths:
      - deploy/phase0_firestore_readonly_probe.py
      - tests/test_phase0_firestore_readonly_probe.py
      - .github/workflows/phase0-firestore-readonly.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify offline privacy and type tests
        run: python -m unittest discover -s tests -p test_phase0_firestore_readonly_probe.py -v
      - name: Install Google authentication library
        run: python -m pip install -q google-auth requests
      - name: Sample Firestore collection field types (GET only, no values published)
        env:
          FIREBASE_PROJECT_ID: stock-market-c5016
          FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET }}
        run: python -m deploy.phase0_firestore_readonly_probe
