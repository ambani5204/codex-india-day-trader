name: One-time 365-day EMA9 EMA15 angle momentum research
on:
  push:
    paths:
      - .github/workflows/ema9-ema15-angle-365-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: trader/backtest_cache
          key: ema9-ema15-365-${{ github.run_id }}
          restore-keys: |
            three-candle-v2-
            ema9-daily-
      - name: Validate research module
        run: python -m py_compile india_trader/ema9_ema15_angle_research.py
      - name: Run NIFTY and SENSEX 365-day index research
        run: |
          test -n "$UPSTOX_ACCESS_TOKEN"
          python -m india_trader.ema9_ema15_angle_research --days 365 --out trader/backtests/ema9_ema15_angle_365.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ema9-ema15-angle-365-report
          path: trader/backtests/ema9_ema15_angle_365.json
          if-no-files-found: error
