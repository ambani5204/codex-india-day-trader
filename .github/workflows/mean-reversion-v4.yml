name: Mean Reversion V4 Three-Year Walk-Forward
on:
  push:
    branches:
      - research/mean-reversion-365d-20261119
    paths:
      - 'deploy/mean_reversion_v4.py'
      - 'deploy/dual_market_execution.py'
      - 'tests/test_dual_market_execution.py'
      - '.github/workflows/mean-reversion-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate existing research unit tests
        run: python -m unittest discover -s tests -p 'test_mean_reversion_365d.py' -v
      - name: Validate equity and option execution accounting
        run: python -m unittest discover -s tests -p 'test_dual_market_execution.py' -v
      - name: Restore historical 1-minute candles
        uses: actions/cache@v4
        with:
          path: trader/mean_reversion_1m_cache
          key: mean-reversion-v4-${{ github.run_id }}
          restore-keys: |
            mean-reversion-three-year-
            mean-reversion-365-
      - name: Retrieve genuine three-year index history
        run: |
          test -n "$UPSTOX_ACCESS_TOKEN" || { echo "::error::UPSTOX_ACCESS_TOKEN missing"; exit 1; }
          python -m deploy.mean_reversion_historical_data --days 1095 --out-dir research_data
      - name: Compare V4 reversal models out of sample
        run: |
          python -m deploy.mean_reversion_v4 --nifty research_data/nifty_1m.csv --sensex research_data/sensex_1m.csv --cost-bps 10 --output mean_reversion_v4_results.json
      - name: Summarize real walk-forward results
        if: success()
        run: |
          python - <<'PY'
          import json,os
          data=json.load(open("mean_reversion_v4_results.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Mean Reversion V4 — Three-Year Walk-Forward\n\n")
              f.write("| Market | Timeframe | OOS trades | Net R | Positive folds | Qualified |\n|---|---|---:|---:|---:|---|\n")
              for market in ("NIFTY","SENSEX"):
                  for tf,x in data[market]["timeframes"].items():
                      f.write(f"| {market} | {tf} | {x['total_holdout_trades']} | {x['total_holdout_net_r']} | {x['positive_folds']}/3 | {x['qualified']} |\n")
              f.write("\n**Index-price proxy only, not option P&L. Research only.**\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mean-reversion-v4-three-year-results
          path: mean_reversion_v4_results.json
          if-no-files-found: warn
