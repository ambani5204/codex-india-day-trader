name: Cloud CE-PE live paper trading (NO REAL ORDERS)

on:
  workflow_dispatch:
  schedule:
    # Retry opportunities: 09:25, 09:45, 10:05, 10:25, 10:45 IST.
    - cron: "55 3 * * 1-5"
    - cron: "15,35,55 4 * * 1-5"
    - cron: "15 5 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-ce-pe-paper-session
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prevent duplicate market-day sessions across retry triggers
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m deploy.cloud_session_gate
      - name: Offline safety and unit tests
        if: steps.gate.outputs.should_run == 'true'
        run: python -m unittest discover -s tests -q
      - name: Verify PRIVATE archive destination before trading
        if: steps.gate.outputs.should_run == 'true'
        env:
          JOURNAL_REPO_TOKEN: ${{ secrets.JOURNAL_REPO_TOKEN }}
        run: python -m deploy.private_journal_sync --verify-only
      - name: Run live option-quote CE/PE paper session (read only)
        if: steps.gate.outputs.should_run == 'true'
        id: session
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET }}
          FIREBASE_PROJECT_ID: stock-market-c5016
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET" ]; then
            echo "Firebase publisher not configured; running paper session without live dashboard"
            python -m deploy.cloud_paper_session
            exit $?
          fi
          pip -q install google-auth requests
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          export PAPER_MARKET="$(python -c 'import datetime; from india_trader.core import IST; from india_trader.schedule import market_for_day; print(market_for_day(datetime.datetime.now(IST).date()) or "NONE")')"
          export PAPER_STATE_FILE="$RUNNER_TEMP/paper-state"
          export PAPER_STOP_FILE="$RUNNER_TEMP/paper-stop"
          echo STARTING > "$PAPER_STATE_FILE"
          python -m deploy.firebase_live_publisher &
          PUBLISHER_PID=$!
          cleanup() {
            touch "$PAPER_STOP_FILE"
            wait "$PUBLISHER_PID" || true
            rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          }
          trap cleanup EXIT
          echo RUNNING > "$PAPER_STATE_FILE"
          set +e
          python -m deploy.cloud_paper_session
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then echo FAILED > "$PAPER_STATE_FILE"; fi
          exit "$result"
      - name: Upload detailed journals ONLY to verified PRIVATE repository
        if: always() && steps.gate.outputs.should_run == 'true' && steps.session.outcome != 'skipped'
        id: private_upload
        continue-on-error: true
        env:
          JOURNAL_REPO_TOKEN: ${{ secrets.JOURNAL_REPO_TOKEN }}
        run: python -m deploy.private_journal_sync
      - name: Publish ONLY public-safe aggregate (never raw quotes/journals)
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: public-safe-ce-pe-summary-${{ github.run_id }}
          path: trader/cloud_paper_summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail visibly when session failed or was incomplete
        if: steps.gate.outputs.should_run == 'true' && (steps.session.outcome != 'success' || steps.private_upload.outcome != 'success')
        run: |
          echo "Cloud paper session failed or incomplete. See aggregate diagnostics."
          exit 1
