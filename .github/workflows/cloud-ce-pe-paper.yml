name: Cloud CE-PE live paper trading (NO REAL ORDERS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloud-ce-pe-paper.yml'
  schedule:
    # First attempt 09:00 IST; repeated opportunities if GitHub delays/drops a cron.
    # Session gate ensures only one active paper session per market day.
    - cron: "30,45 3 * * 1-5"
    - cron: "0,15,30,45 4 * * 1-5"
    - cron: "0,15,30 5 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-ce-pe-paper-session
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 405
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prevent duplicate market-day sessions across retry triggers
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m deploy.cloud_session_gate
      - name: Report duplicate or inactive paper session explicitly
        if: steps.gate.outputs.should_run != 'true'
        run: |
          echo "::notice::SKIPPED: this run did not start a paper-trading session."
          echo "## Paper session NOT started" >> "$GITHUB_STEP_SUMMARY"
          echo "The session gate skipped this run. No trades or Firestore publication occurred in this run." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::MARKET_CLOSED_OR_DUPLICATE: no trading was attempted; this is an expected skip."
          echo "Outcome: SKIPPED (not a completed trading session)." >> "$GITHUB_STEP_SUMMARY"
      - name: Offline safety and unit tests
        if: steps.gate.outputs.should_run == 'true'
        run: python -m unittest discover -s tests -q
      - name: Verify all live paper strategies use structural candle stops
        if: steps.gate.outputs.should_run == 'true'
        run: python -m unittest discover -s tests -p 'test_structural_stop_policy.py' -v
      - name: Validate ORB expiry paper-only candidate routing
        if: steps.gate.outputs.should_run == 'true'
        run: python -m india_trader.orb_expiry_shadow --self-test
      - name: Verify PRIVATE archive destination before trading
        if: steps.gate.outputs.should_run == 'true'
        env:
          JOURNAL_REPO_TOKEN: ${{ secrets.JOURNAL_REPO_TOKEN }}
        run: python -m deploy.private_journal_sync --verify-only
      - name: Restore previous same-day private journals before starting workers
        if: steps.gate.outputs.should_run == 'true'
        env:
          JOURNAL_REPO_TOKEN: ${{ secrets.JOURNAL_REPO_TOKEN }}
        run: python -m deploy.private_journal_restore
      - name: Run live option-quote CE/PE paper session (read only)
        if: steps.gate.outputs.should_run == 'true'
        id: session
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET }}
          FIREBASE_PROJECT_ID: stock-market-c5016
          JOURNAL_REPO_TOKEN: ${{ secrets.JOURNAL_REPO_TOKEN }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET" ]; then
            echo "::error::Firebase service account secret is missing; cannot publish dashboard"
            exit 1
          fi
          pip -q install google-auth requests
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          export PAPER_MARKET="BOTH"
          export PAPER_STATE_FILE="$RUNNER_TEMP/paper-state"
          export PAPER_STOP_FILE="$RUNNER_TEMP/paper-stop"
          echo STARTING > "$PAPER_STATE_FILE"
          # Durable, private-only snapshots while the worker is running.
          # Cancellation can skip post-run steps, so archive during the session.
          python -m deploy.private_journal_checkpoint &
          CHECKPOINT_PID=$!
          PAPER_MARKET=NIFTY python -m deploy.firebase_live_publisher &
          PUBLISHER_PID=$!
          PAPER_MARKET=SENSEX python -m deploy.firebase_live_publisher &
          SENSEX_PUBLISHER_PID=$!
          PUBLISHER_STATUS=0
          cleanup() {
            touch "$PAPER_STOP_FILE"
            wait "$PUBLISHER_PID" || PUBLISHER_STATUS=$?
            wait "$SENSEX_PUBLISHER_PID" || PUBLISHER_STATUS=$?
            kill "$CHECKPOINT_PID" 2>/dev/null || true
            wait "$CHECKPOINT_PID" 2>/dev/null || true
            rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
            if [ "$PUBLISHER_STATUS" -ne 0 ]; then
              echo "::error::Firestore publisher exited with code $PUBLISHER_STATUS"
            fi
          }
          trap cleanup EXIT
          echo RUNNING > "$PAPER_STATE_FILE"
          # All enabled paper strategies run inside this ONE market-day workflow.\n          # Sidecars preserve separate ledgers and Firestore publishers.\n          # EMA9 V2 is an independent paper-only sidecar within THIS existing workflow.
          # Its journal and Firestore collection are isolated from legacy strategies.
          python tools/india.py upstox-sync || echo "::warning::EMA9 instrument refresh failed"
          export PAPER_SESSION_START_IST="$(TZ=Asia/Kolkata date +%H%M)"
          python -m india_trader.ema9_v2_live_sidecar &
          EMA9_PID=$!
          python -m deploy.three_candle_live_publisher &
          THREE_PUBLISHER_PID=$!
          python -m deploy.ema9_ema15_live_publisher &
          EMA_PUBLISHER_PID=$!
          python -m india_trader.three_candle_live_sidecar &
          THREE_PID=$!
          python -m india_trader.ema9_ema15_live_sidecar &
          EMA_PID=$!
          set +e
          python -m deploy.cloud_paper_session --market BOTH
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then echo FAILED > "$PAPER_STATE_FILE"; fi
          # Allow the EMA9 sidecar to complete its paper session and publish
          # its separate results without affecting legacy trade execution.
          EMA9_STATUS=0
          wait "$EMA9_PID" || EMA9_STATUS=$?
          if [ -f "trader/ema9_v2_live/$(TZ=Asia/Kolkata date +%F).jsonl" ]; then
            python -m deploy.publish_ema9_v2_paper || EMA9_STATUS=$?
          fi
          THREE_STATUS=0
          EMA_STATUS=0
          wait "$THREE_PID" || THREE_STATUS=$?
          wait "$EMA_PID" || EMA_STATUS=$?
          if [ -s "trader/three_candle_live/$(TZ=Asia/Kolkata date +%F).jsonl" ]; then
            python -m deploy.publish_three_candle_paper || THREE_STATUS=$?
          else
            echo "::warning::3 Candle journal missing; publisher skipped (sidecar exit=$THREE_STATUS)"
            if [ "$THREE_STATUS" -eq 0 ] && [ "$PAPER_SESSION_START_IST" -lt 1445 ]; then THREE_STATUS=2; fi
          fi
          if [ -s "trader/ema9_ema15_live/$(TZ=Asia/Kolkata date +%F).jsonl" ]; then
            python -m deploy.publish_ema9_ema15_paper || EMA_STATUS=$?
          else
            echo "::warning::EMA9/15 journal missing; publisher skipped (sidecar exit=$EMA_STATUS)"
            if [ "$EMA_STATUS" -eq 0 ] && [ "$PAPER_SESSION_START_IST" -lt 1445 ]; then EMA_STATUS=2; fi
          fi
          kill "$THREE_PUBLISHER_PID" "$EMA_PUBLISHER_PID" 2>/dev/null || true
          wait "$THREE_PUBLISHER_PID" 2>/dev/null || true
          wait "$EMA_PUBLISHER_PID" 2>/dev/null || true
          echo "### Strategy worker outcomes" >> "$GITHUB_STEP_SUMMARY"
          echo "| Worker | Exit code |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Legacy CE/PE | $result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| EMA9 V2 | $EMA9_STATUS (noon cutoff for new sessions) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 3 Candle | $THREE_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| EMA9/15 | $EMA_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          if [ -f trader/cloud_paper_summary.json ]; then
            python -c 'import json; r=json.load(open("trader/cloud_paper_summary.json")); print("::notice::Legacy session status="+str(r.get("status"))+" startup="+str(r.get("startup"))+" detail="+str(r.get("failure_detail")))'
          fi
          if [ "$THREE_STATUS" -ne 0 ] || [ "$EMA_STATUS" -ne 0 ] || [ "$result" -ne 0 ]; then
            echo FAILED > "$PAPER_STATE_FILE"
          else
            echo FINISHED > "$PAPER_STATE_FILE"
          fi
          cleanup
          trap - EXIT
          if [ "$THREE_STATUS" -ne 0 ] || [ "$EMA_STATUS" -ne 0 ]; then
            echo "::error::Strategy paper sidecar failed: 3 Candle=$THREE_STATUS EMA9/15=$EMA_STATUS"
            exit 1
          fi
          if [ "$EMA9_STATUS" -ne 0 ]; then echo "::warning::EMA9 V2 sidecar failed ($EMA9_STATUS)"; fi
          if [ "$PUBLISHER_STATUS" -ne 0 ]; then exit "$PUBLISHER_STATUS"; fi
          exit "$result"
      - name: Upload detailed journals ONLY to verified PRIVATE repository
        if: always() && steps.gate.outputs.should_run == 'true' && steps.session.outcome != 'skipped'
        id: private_upload
        continue-on-error: true
        env:
          JOURNAL_REPO_TOKEN: ${{ secrets.JOURNAL_REPO_TOKEN }}
        run: |
          if ! compgen -G "trader/paper_upstox/$(TZ=Asia/Kolkata date +%F)_*.jsonl" > /dev/null; then
            echo "::error::NO_LEGACY_JOURNAL: main paper worker produced no dated journal; nothing to archive"
            echo "Private archive: NO_LEGACY_JOURNAL" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python -m deploy.private_journal_sync
      - name: Publish ONLY public-safe aggregate (never raw quotes/journals)
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: public-safe-ce-pe-summary-${{ github.run_id }}
          path: trader/cloud_paper_summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report actual paper-session outcome
        if: always()
        run: |
          echo "## Cloud paper session execution" >> "$GITHUB_STEP_SUMMARY"
          echo "Gate: ${{ steps.gate.outputs.should_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Session step: ${{ steps.session.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Private journal upload: ${{ steps.private_upload.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f trader/cloud_paper_summary.json ]; then
            python -c 'import json,os; r=json.load(open("trader/cloud_paper_summary.json")); f=os.environ["GITHUB_STEP_SUMMARY"]; open(f,"a").write("Legacy worker: "+str(r.get("status"))+"; startup: "+str(r.get("startup"))+"; reason: "+str(r.get("failure_detail"))+"\\n")'
          fi
          if [ "${{ steps.gate.outputs.should_run }}" = "true" ] && [ "${{ steps.session.outcome }}" = "success" ] && [ "${{ steps.private_upload.outcome }}" = "success" ]; then
            echo "Verified workflow steps completed; inspect Firebase for actual trades." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NO VERIFIED COMPLETE SESSION IN THIS RUN." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fail visibly when session failed or was incomplete
        if: steps.gate.outputs.should_run == 'true' && (steps.session.outcome != 'success' || steps.private_upload.outcome != 'success')
        run: |
          echo "Cloud paper session failed or incomplete. See aggregate diagnostics."
          exit 1
