name: EMA9 V2 weekly paper research
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
permissions:
  contents: read
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: stock-market-c5016
      FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate EMA9 V2 weekly Firestore paper report
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET" || { echo "::error::Missing Firebase secret"; exit 1; }
          python -m pip install -q google-auth requests
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET" > "$RUNNER_TEMP/firebase.json"
          chmod 600 "$RUNNER_TEMP/firebase.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          python -m deploy.ema9_v2_weekly_research
          rm -f "$RUNNER_TEMP/firebase.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ema9-v2-weekly-paper-research
          path: trader/research/ema9_v2_weekly.json
          retention-days: 90
