name: Phase 0 one-time backed-up paper-history cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase0-backed-up-cleanup.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q google-auth requests
      - name: Identify duplicate dates and back up affected Firestore documents
        env:
          FIREBASE_PROJECT_ID: stock-market-c5016
          FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET }}
        run: python -m deploy.phase0_backed_up_cleanup plan
      - uses: actions/upload-artifact@v4
        with:
          name: phase0-private-firestore-backup
          path: |
            phase0_cleanup_backup.json
            phase0_cleanup_digest.txt
          retention-days: 90
          if-no-files-found: error
  delete-backed-up-records:
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q google-auth requests
      - uses: actions/download-artifact@v4
        with:
          name: phase0-private-firestore-backup
      - name: Delete only unchanged, backed-up paper records
        env:
          FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET }}
        run: python -m deploy.phase0_backed_up_cleanup apply
