name: Build Monitor APK

# Manual: wraps mobile/www (the Algobani paper monitor) into a debug Android APK
# via Capacitor + Gradle on a GitHub-hosted runner (Android SDK preinstalled).
# Produces a sideloadable debug APK as a run artifact. PAPER monitor only.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Wrap web app and assemble debug APK
        working-directory: mobile
        run: |
          set -euo pipefail
          test -f www/index.html
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx --yes cap init "Algobani Monitor" com.algobani.monitor --web-dir www
          npx --yes cap add android
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             algobani-monitor-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: algobani-monitor-apk
          path: algobani-monitor-debug.apk
          if-no-files-found: error
      - name: Publish APK to a Release (direct phone-installable link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete monitor-apk --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create monitor-apk algobani-monitor-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Algobani Monitor (debug APK)" \
            --notes "Debug, sideloadable. PAPER monitor only. Built $(date -u +%FT%TZ) from ${GITHUB_SHA::7}. Install: open this APK on Android and allow install from this source."
