name: 3 Candle Top Down CE PE live paper (NO ORDERS)
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1-5"
permissions:
  contents: read
concurrency:
  group: three-candle-paper-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET }}
      FIREBASE_PROJECT_ID: stock-market-c5016
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify offline Python syntax and strategy tests
        run: |
          python -m py_compile india_trader/three_candle_top_down_v2.py india_trader/three_candle_live_sidecar.py deploy/publish_three_candle_paper.py
          python -m unittest discover -s tests -q
      - name: Live paper simulation and continuous Firestore publication
        run: |
          set -euo pipefail
          test -n "$UPSTOX_ACCESS_TOKEN"
          test -n "$FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET"
          python -m pip install -q google-auth requests
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET" > "$RUNNER_TEMP/firebase-three-candle.json"
          chmod 600 "$RUNNER_TEMP/firebase-three-candle.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-three-candle.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          python tools/india.py upstox-sync
          python -m deploy.three_candle_live_publisher &
          PUBLISHER_PID=$!
          set +e
          python -m india_trader.three_candle_live_sidecar
          SESSION_RESULT=$?
          set -e
          python -m deploy.publish_three_candle_paper
          kill "$PUBLISHER_PID" 2>/dev/null || true
          wait "$PUBLISHER_PID" 2>/dev/null || true
          exit "$SESSION_RESULT"
