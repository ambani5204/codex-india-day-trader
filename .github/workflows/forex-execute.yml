name: Forex Research - 2024 EURUSD (isolated)
on:
  push:
    paths:
      - .github/workflows/forex-execute.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/forex-isolated-backtest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download historical EURUSD 2024
        run: |
          mkdir -p forex_data
          npx --yes dukascopy-node -i eurusd -from 2024-01-01 -to 2025-01-01 -t m1 -f csv -v
          find . -maxdepth 3 -name '*.csv' | head -20
          python - <<'PY'
          import csv,glob,pathlib,datetime as dt,collections
          paths=glob.glob("download/**/*.csv",recursive=True)
          if not paths:raise SystemExit("DATA_UNAVAILABLE: inspect download output and fix format")
          dest=pathlib.Path("forex_data/eurusd-2024.csv")
          count=0; invalid=0; years=collections.Counter(); samples=[]
          with dest.open("w",newline="") as f:
              w=csv.writer(f);w.writerow(["timestamp","open","high","low","close"])
              for name in paths:
                  for row in csv.DictReader(open(name,newline="")):
                      raw=row["timestamp"]
                      if len(samples)<3:samples.append(raw)
                      try:
                          if raw.strip().replace(".","",1).isdigit():
                              value=float(raw);value=value/1000 if value>1e11 else value
                              stamp=dt.datetime.fromtimestamp(value,dt.timezone.utc)
                          else:
                              stamp=dt.datetime.fromisoformat(raw.replace("Z","+00:00"))
                              if stamp.tzinfo is None:stamp=stamp.replace(tzinfo=dt.timezone.utc)
                          years[stamp.year]+=1
                          w.writerow([stamp.isoformat(),row["open"],row["high"],row["low"],row["close"]]);count+=1
                      except (ValueError,OverflowError,KeyError):
                          invalid+=1
          print("raw timestamp samples",samples)
          print("normalized candles",count,"invalid",invalid,"year distribution",dict(years))
          if years[2024]<10000:raise SystemExit("DATA_UNAVAILABLE: source contains fewer than 10000 2024 candles after timestamp normalization")
          PY
      - name: Run yearly analysis
        run: python forex_research/forex_yearly.py --csv forex_data/eurusd-2024.csv --pair eurusd --year 2024 --out forex_results/eurusd-2024.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eurusd-2024-results
          path: forex_results/*.json
          if-no-files-found: warn
