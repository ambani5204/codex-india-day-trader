name: Phase 0 read-only Firestore internal reconciliation
on:
  push:
    branches:
      - audit/phase0-exit-evidence-20261120
    paths:
      - deploy/phase0_firestore_internal_reconcile.py
      - tests/test_phase0_firestore_internal_reconcile.py
      - .github/workflows/phase0-firestore-internal-reconcile.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify synthetic count and PnL consistency tests
        run: python -m unittest discover -s tests -p test_phase0_firestore_internal_reconcile.py -v
      - name: Install Google authentication dependencies
        run: python -m pip install -q google-auth requests
      - name: Check actual Firestore history/latest/nightly invariants (GET only)
        env:
          FIREBASE_PROJECT_ID: stock-market-c5016
          FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOCK_MARKET }}
        run: python -m deploy.phase0_firestore_internal_reconcile
